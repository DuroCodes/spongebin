name: Release extension

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_existing:
        description: "Skip release-please and publish the current extension/package.json version (Marketplace + Open VSX + GitHub Release asset)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' || inputs.publish_existing == false
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['extension--release_created'] }}
      tag_name: ${{ steps.release.outputs['extension--tag_name'] }}
      version: ${{ steps.release.outputs['extension--version'] }}
    steps:
      - name: Create release PR / GitHub release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() &&
      needs.release-please.result != 'failure' &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_existing)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version and tag
        id: meta
        run: |
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            VERSION="${{ needs.release-please.outputs.version }}"
            TAG="${{ needs.release-please.outputs.tag_name }}"
          else
            VERSION="$(node -p "require('./extension/package.json').version")"
            TAG="extension-v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "vsix=spongebin-vscode-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          echo "Publishing extension v${VERSION} (tag ${TAG})"

      - name: Typecheck extension
        working-directory: extension
        run: bun run check

      - name: Package VSIX
        working-directory: extension
        run: bun run package

      - name: Ensure GitHub Release and upload VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VSIX="extension/${{ steps.meta.outputs.vsix }}"
          test -f "$VSIX"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            # Creates the tag (if needed), release, source zip/tar, and attaches the VSIX.
            gh release create "$TAG" "$VSIX" \
              --title "$TAG" \
              --notes "Release ${{ steps.meta.outputs.version }} of the spongebin editor extension." \
              --target "${{ github.sha }}"
          fi

      - name: Publish to VS Code Marketplace
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT secret is not set; skipping Marketplace publish."
            exit 0
          fi
          bunx vsce publish --packagePath "${{ steps.meta.outputs.vsix }}"

      - name: Publish to Open VSX
        working-directory: extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT secret is not set; skipping Open VSX publish."
            exit 0
          fi
          bunx ovsx publish "${{ steps.meta.outputs.vsix }}"
